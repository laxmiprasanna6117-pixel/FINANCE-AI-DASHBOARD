[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fda-finance-ai"
version = "1.0.0"
description = "Finance Data Analysis & AI Automation Dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "altair>=5.0.0",
    "pillow>=10.0.0",
    "requests>=2.30.0"
]
